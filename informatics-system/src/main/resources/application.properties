server.port=8080
logging.file.name=logs.log
logging.file.path=./log

server.port.front=3000
#logging.level.root=WARN
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=500

spring.jpa.hibernate.ddl-auto=none
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.url=${SPRING_DATASOURCE_URL}
spring.flyway.user=${SPRING_DATASOURCE_USERNAME}
spring.flyway.password=${SPRING_DATASOURCE_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Each testcase is a separate message, so partitions are what let workers share a submission.
# A consumer group hands any one partition to a single member, so keep this at or above the
# worker count. Partition counts can only be raised, never lowered.
ge.freeuni.informatics.kafka.submissionTopicPartitions=16
ge.freeuni.informatics.kafka.callbackTopicPartitions=4

spring.kafka.consumer.group-id=core
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

ge.freeuni.informatics.defaultLanguage=KA
ge.freeuni.informatics.host=http://localhost

ge.freeuni.informatics.mail.address=${INFORMATICS_MAIL_ADDRESS:noreply@localhost}
ge.freeuni.informatics.mail.password=${INFORMATICS_MAIL_PASSWORD:changeme}
ge.freeuni.informatics.mail.host=${INFORMATICS_MAIL_HOST:localhost}

ge.freeuni.informatics.server.user.passwordRecoveryValidityMinutes=30

ge.freeuni.informatics.Task.submissionDirectoryAddress=/files/tasks/:taskId/submissions
ge.freeuni.informatics.Task.statementDirectoryAddress=/files/tasks/:taskId/statements
ge.freeuni.informatics.Task.testDirectoryAddress=/files/tasks/:taskId/tests
ge.freeuni.informatics.Task.taskDirectoryAddress=/files/tasks/:taskId
ge.freeuni.informatics.Task.tempDirectoryAddress=/files/tmp
ge.freeuni.informatics.Task.postDirectoryAddress=/files/posts

ge.freeuni.informatics.maxImageSizeMB=3
# Per-endpoint caps are enforced in controllers; image uploads use maxImageSizeMB above.
ge.freeuni.informatics.maxTestcasesZipMb=100
ge.freeuni.informatics.maxSingleTestcaseFileMb=32

# DispatcherServlet parses multipart once for all handlers: ceilings must fit the largest
# allowed upload (bulk testcase ZIP). Stricter limits are applied in controllers and nginx.
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# Submissions left mid-judgement by a restart are re-driven at startup. Anything older than
# maxAgeHours is failed instead of re-judged, so a stale submission cannot re-score a
# finished contest.
ge.freeuni.informatics.judge.recovery.enabled=true
ge.freeuni.informatics.judge.recovery.maxAgeHours=24

ge.freeuni.informatics.defaultPageSize=20
ge.freeuni.informatics.maxPageSize=200

# Session configuration
# Short-term session timeout (in seconds) - default 30 minutes
server.servlet.session.timeout=1800
# Remember Me token validity (in seconds) - default 30 days
ge.freeuni.informatics.security.rememberMe.tokenValiditySeconds=2592000
# Remember Me key for token signing (should be changed in production)
ge.freeuni.informatics.security.rememberMe.key=${INFORMATICS_REMEMBER_ME_KEY:change-me-in-production}

# Worker configuration (common/default values)
# Environment-specific overrides are in application-dev.properties and application-prod.properties
ge.freeuni.informatics.worker.initialCount=4
ge.freeuni.informatics.worker.serverUrl=http://core:8080
# Image tags follow the deployed release. INFORMATICS_VERSION is passed into the core
# container from VERSION in .env, so the tag lives in exactly one place.
ge.freeuni.informatics.worker.dockerImage=informatics/worker:${INFORMATICS_VERSION:latest}
# Image workers execute submissions in; must exist on the host running the workers.
ge.freeuni.informatics.worker.sandboxImage=${INFORMATICS_SANDBOX_IMAGE:sandbox:latest}
ge.freeuni.informatics.worker.workerUsername=worker
ge.freeuni.informatics.worker.workerPassword=${INFORMATICS_WORKER_PASSWORD:changeme}

# Access database configuration (common/default values)
# Environment-specific overrides are in application-dev.properties and application-prod.properties
spring.datasource.access.username=
spring.datasource.access.password=
spring.datasource.access.driver-class-name=net.ucanaccess.jdbc.UcanaccessDriver
