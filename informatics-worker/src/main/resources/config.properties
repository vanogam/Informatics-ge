fileservice.type=local
fileStorageDirectory.url=/files
sharedDirectory.url=/shared
# Image submissions are executed in. Override per deployment with SANDBOX_IMAGE.
sandbox.image=sandbox:latest

# Sandbox resource limits.
# cpuset: cores the sandbox container may use. Empty means one core derived from the worker id.
# Pinning through the cgroup cpuset is what actually denies the contestant parallelism -
# HostConfig.CpuCount is a Windows-only field and has no effect on Linux.
sandbox.cpuset=
# Ceiling for the whole container in MB. Must cover the task's memory limit plus the manager
# running beside it; the submission is still held to its own limit by ulimit.
sandbox.memoryMB=2560
