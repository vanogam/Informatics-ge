# Dev-specific configuration overrides
# This file is loaded when SPRING_PROFILES_ACTIVE=dev

# Worker configuration for dev environment
ge.freeuni.informatics.worker.idPrefix=dev
ge.freeuni.informatics.worker.dockerNetwork=informatics_dev
ge.freeuni.informatics.worker.filesPath=${INFORMATICS_HOME_DIR:/home/informatics/dev}/files
ge.freeuni.informatics.worker.logsPath=${INFORMATICS_HOME_DIR:/home/informatics/dev}/logs/worker
ge.freeuni.informatics.worker.sharedPath=${INFORMATICS_HOME_DIR:/home/informatics/dev}/files/worker/shared

# Access database path for dev (local development path)
spring.datasource.access.url=jdbc:ucanaccess:/home/vano/Desktop/informatics/tasks.mdb

# Host configuration for dev
ge.freeuni.informatics.host=https://localhost

# CORS for CRA dev server: patterns cover localhost and typical LAN URLs, both plain http (the
# CRA dev server's default, unless HTTPS=true) and https, so credentialed requests from this
# machine or another one (http(s)://<LAN-IP>:3000) are allowed; adjust if needed.
ge.freeuni.informatics.cors.allowedOriginPatterns=http://localhost:*,https://localhost:*,http://127.0.0.1:*,https://127.0.0.1:*,http://192.168.*:*,https://192.168.*:*,http://10.*:*,https://10.*:*

